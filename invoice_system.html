<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>發票辨識系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1e2235;
  --border: #2a3050;
  --accent: #4f8ef7;
  --accent2: #7b5ea7;
  --green: #3ecf8e;
  --red: #f76b6b;
  --yellow: #f5c842;
  --text: #e8eaf0;
  --muted: #6b7494;
  --font: 'Noto Sans TC', sans-serif;
  --mono: 'DM Mono', monospace;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); }
.app { height: 100vh; display: flex; flex-direction: column; }

.header {
  padding: 16px 28px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); flex-shrink: 0;
}
.header-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
.header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

.main { display: flex; flex: 1; overflow: hidden; }

.left-panel {
  width: 320px; min-width: 280px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  background: var(--surface);
}
.panel-header {
  padding: 14px 18px 10px; border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--muted); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.badge {
  background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; font-family: var(--mono);
}
.drop-zone {
  margin: 14px; border: 1.5px dashed var(--border); border-radius: 12px;
  padding: 24px 14px; text-align: center; cursor: pointer; transition: all .2s;
  background: var(--bg); flex-shrink: 0; position: relative;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: rgba(79,142,247,.06); }
.drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-icon { font-size: 26px; margin-bottom: 8px; }
.drop-text { font-size: 12px; color: var(--muted); line-height: 1.7; pointer-events: none; }
.drop-text span { color: var(--accent); font-weight: 600; }

.file-list { flex: 1; overflow-y: auto; padding: 0 14px 14px; }
.file-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 11px;
  border-radius: 8px; margin-bottom: 6px; background: var(--surface2);
  border: 1px solid var(--border); cursor: pointer; transition: all .15s; position: relative;
}
.file-item:hover { border-color: var(--accent); }
.file-thumb {
  width: 34px; height: 34px; border-radius: 6px; background: var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; overflow: hidden;
}
.file-thumb img { width: 100%; height: 100%; object-fit: cover; }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.status-dot.pending { background: var(--muted); }
.status-dot.loading { background: var(--yellow); animation: pulse 1s infinite; }
.status-dot.done    { background: var(--green); }
.status-dot.error   { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.file-remove {
  position: absolute; top: 5px; right: 5px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--border); border: none; cursor: pointer; color: var(--muted); font-size: 10px;
  display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .15s;
}
.file-item:hover .file-remove { opacity: 1; }
.file-remove:hover { background: var(--red); color: #fff; }

.analyze-btn {
  margin: 0 14px 14px; padding: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity .2s; font-family: var(--font);
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0;
}
.analyze-btn:hover:not(:disabled) { opacity: .88; }
.analyze-btn:disabled { opacity: .4; cursor: not-allowed; }

.right-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar {
  padding: 12px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); flex-shrink: 0;
}
.toolbar-left { display: flex; align-items: center; gap: 16px; }
.result-count { font-size: 13px; color: var(--muted); }
.result-count strong { color: var(--text); }
.dl-btn {
  padding: 8px 18px; background: var(--green); border: none; border-radius: 8px;
  color: #0f1117; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .2s;
  font-family: var(--font); display: flex; align-items: center; gap: 6px;
}
.dl-btn:hover:not(:disabled) { opacity: .85; }
.dl-btn:disabled { opacity: .35; cursor: not-allowed; }

.table-wrap { flex: 1; overflow: auto; padding: 18px 22px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--surface); padding: 10px 13px; text-align: left;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px;
  color: var(--muted); border-bottom: 1px solid var(--border);
  white-space: nowrap; position: sticky; top: 0; z-index: 1;
}
tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
tbody tr:hover { background: var(--surface2); }
tbody td { padding: 11px 13px; vertical-align: middle; }
.td-mono { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.td-amount { font-family: var(--mono); font-size: 13px; font-weight: 500; text-align: right; }
.td-tax { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.td-type {
  display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 500; background: rgba(79,142,247,.15); color: var(--accent);
}
.td-name { font-weight: 500; max-width: 180px; }
.td-notes { color: var(--muted); font-size: 11px; }
.td-loading { color: var(--yellow); font-size: 12px; }
.td-error   { color: var(--red); font-size: 12px; }
.total-row td { font-weight: 700; background: var(--surface); }
.total-row .td-amount { color: var(--green); }
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--muted); gap: 12px; padding: 80px 60px; text-align: center;
}
.empty-icon { font-size: 48px; opacity: .25; }
.empty p { font-size: 14px; line-height: 1.8; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-icon">🧾</div>
    <div>
      <h1>發票辨識系統</h1>
      <p>上傳發票圖檔，AI 自動截取關鍵欄位並匯出 Excel</p>
    </div>
  </div>
  <div class="main">
    <div class="left-panel">
      <div class="panel-header">
        上傳檔案
        <span class="badge" id="file-count" style="display:none">0</span>
      </div>
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.pdf" />
        <div class="drop-icon">📁</div>
        <div class="drop-text"><span>點擊選取</span>或拖曳發票至此<br>支援 JPG、PNG、PDF</div>
      </div>
      <div class="file-list" id="file-list"></div>
      <button class="analyze-btn" id="analyze-btn" disabled>✨ 開始辨識</button>
    </div>
    <div class="right-panel">
      <div class="toolbar">
        <div class="toolbar-left">
          <span class="result-count" id="result-count">尚未上傳任何檔案</span>
          <span class="result-count" id="sum-display" style="display:none"></span>
        </div>
        <button class="dl-btn" id="dl-btn" disabled>↓ 下載 Excel</button>
      </div>
      <div id="table-area">
        <div class="empty">
          <div class="empty-icon">🧾</div>
          <p>請在左側上傳發票圖檔<br>支援 JPG、PNG、PDF 格式</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://invoice-proxy.sauuo0927.workers.dev";

const SYSTEM = `你是台灣統一發票辨識專家。從發票圖片精確提取資料，只回傳 JSON，不要任何說明或 markdown。

格式：
{
  "invoice_type": "憑證類別（三聯式統一發票/二聯式統一發票/電子發票證明聯/收銀機統一發票）",
  "issuer": "開立行號（賣方公司名稱）",
  "date": "日期 YYYY-MM-DD（民國年+1911=西元年）",
  "amount": 未稅金額數字或null,
  "tax": 稅額數字或null,
  "total": 含稅總計數字,
  "invoice_number": "發票號碼（格式XX-XXXXXXXX）",
  "notes": "備註或null"
}
只填數字，不含符號和逗號。`;

let files = [];
let idSeq = 0;

const dropZone    = document.getElementById('drop-zone');
const fileInput   = document.getElementById('file-input');
const fileListEl  = document.getElementById('file-list');
const analyzeBtn  = document.getElementById('analyze-btn');
const dlBtn       = document.getElementById('dl-btn');
const tableArea   = document.getElementById('table-area');
const fileCountEl = document.getElementById('file-count');
const resultCount = document.getElementById('result-count');
const sumDisplay  = document.getElementById('sum-display');

fileInput.addEventListener('change', e => addFiles(e.target.files));
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  addFiles(e.dataTransfer.files);
});

function addFiles(newFiles) {
  Array.from(newFiles)
    .filter(f => /\.(jpg|jpeg|png|webp|pdf)$/i.test(f.name))
    .forEach(f => files.push({
      id: ++idSeq, file: f,
      thumb: /\.pdf$/i.test(f.name) ? null : URL.createObjectURL(f),
      status: 'pending', data: null, error: null,
    }));
  render();
}

function removeFile(id) {
  files = files.filter(f => f.id !== id);
  render();
}

analyzeBtn.addEventListener('click', async () => {
  const pending = files.filter(f => f.status === 'pending');
  if (!pending.length) return;
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = '⏳ 辨識中…';
  for (const item of pending) {
    item.status = 'loading'; render();
    try {
      item.data = await analyzeInvoice(item.file);
      item.status = 'done';
    } catch(e) {
      item.error = e.message; item.status = 'error';
    }
    render();
  }
  updateAnalyzeBtn();
});

// PDF 轉圖片（使用 PDF.js，在瀏覽器端執行）
async function pdfToBase64Images(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const images = [];

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 4.0 }); // 4.0x 最高安全解析度
    const canvas = document.createElement('canvas');
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    // 取得 base64（去掉 data:image/png;base64, 前綴）
    // 超過 4.5MB 自動降低品質，避免超過 API 5MB 上限
    let quality = 0.98;
    let dataUrl = canvas.toDataURL('image/jpeg', quality);
    while (dataUrl.length * 0.75 > 4.5 * 1024 * 1024 && quality > 0.7) {
      quality -= 0.05;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }
    images.push(dataUrl.split(',')[1]);
  }
  return images;
}

async function analyzeInvoice(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const isPdf = ext === 'pdf';

  // PDF：轉換所有頁面，取資料最完整的結果
  if (isPdf) {
    const pages = await pdfToBase64Images(file);
    if (!pages.length) throw new Error('PDF 轉換失敗，請確認檔案是否正常');

    // 若只有一頁直接辨識
    if (pages.length === 1) return await callClaudeWithImage(pages[0], 'image/jpeg');

    // 多頁：全部辨識，取資料最完整的（有發票號碼且金額不為 null 的）
    const results = [];
    for (const page of pages) {
      try {
        const result = await callClaudeWithImage(page, 'image/jpeg');
        results.push(result);
      } catch(e) { /* 跳過辨識失敗的頁 */ }
    }
    if (!results.length) throw new Error('所有頁面辨識失敗');

    // 評分：有發票號碼+2，有總計+2，有未稅金額+1，有稅額+1
    const scored = results.map(r => ({
      r,
      score: (r.invoice_number ? 2 : 0) + (r.total ? 2 : 0) + (r.amount ? 1 : 0) + (r.tax ? 1 : 0)
    }));
    scored.sort((a, b) => b.score - a.score);
    return scored[0].r;
  }

  // 一般圖片
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const mediaType = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'}[ext] || 'image/jpeg';
  return await callClaudeWithImage(b64, mediaType);
}

async function callClaudeWithImage(b64, mediaType) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: SYSTEM,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
        { type: 'text', text: '請辨識這張發票，回傳 JSON。' }
      ]}]
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  let raw = data.content?.[0]?.text?.trim() || '';
  if (raw.startsWith('```')) raw = raw.replace(/^```[^\n]*\n?/,'').replace(/```$/,'').trim();
  return JSON.parse(raw);
}

dlBtn.addEventListener('click', () => {
  const headers = ['憑證類別','開立行號','日期','金額（未稅）','稅額','含稅總計','發票號碼','備註'];
  const fields  = ['invoice_type','issuer','date','amount','tax','total','invoice_number','notes'];
  const done = files.filter(f => f.data);
  const lines = ['\uFEFF' + headers.join(',')];
  done.forEach(f => lines.push(fields.map(k => `"${String(f.data[k]??'').replace(/"/g,'""')}"`).join(',')));
  const sa = done.reduce((s,f)=>s+(Number(f.data.amount)||0),0);
  const st = done.reduce((s,f)=>s+(Number(f.data.tax)||0),0);
  const sT = done.reduce((s,f)=>s+(Number(f.data.total)||0),0);
  lines.push(`"合計","","","${sa}","${st}","${sT}","",""`);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = `發票明細_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});

function render() {
  // file list
  fileCountEl.style.display = files.length ? '' : 'none';
  fileCountEl.textContent = files.length;
  fileListEl.innerHTML = files.map(f => `
    <div class="file-item">
      <div class="file-thumb">${f.thumb ? `<img src="${f.thumb}">` : '📄'}</div>
      <div class="file-info">
        <div class="file-name">${esc(f.file.name)}</div>
        <div class="file-meta">${fmtSize(f.file.size)}${f.data?.invoice_number?' · '+f.data.invoice_number:''}</div>
      </div>
      <span class="status-dot ${f.status}"></span>
      <button class="file-remove" onclick="removeFile(${f.id})">✕</button>
    </div>`).join('');

  // table
  if (!files.length) {
    tableArea.innerHTML = `<div class="empty"><div class="empty-icon">🧾</div><p>請在左側上傳發票圖檔<br>支援 JPG、PNG、PDF 格式</p></div>`;
  } else {
    const done = files.filter(f=>f.data);
    const sa = done.reduce((s,f)=>s+(Number(f.data.amount)||0),0);
    const st = done.reduce((s,f)=>s+(Number(f.data.tax)||0),0);
    const sT = done.reduce((s,f)=>s+(Number(f.data.total)||0),0);
    const rows = files.map(f => {
      if (f.status==='loading') return `<tr><td colspan="8" class="td-loading">⏳ 辨識中：${esc(f.file.name)}</td></tr>`;
      if (f.status==='error')   return `<tr><td colspan="8" class="td-error">✗ ${esc(f.file.name)}：${esc(f.error)}</td></tr>`;
      if (f.status==='pending') return `<tr><td colspan="7" style="color:var(--muted);font-size:12px">${esc(f.file.name)}</td><td style="color:var(--muted);font-size:11px">待辨識</td></tr>`;
      const d=f.data;
      return `<tr>
        <td><span class="td-type">${esc(d.invoice_type||'—')}</span></td>
        <td class="td-name">${esc(d.issuer||'—')}</td>
        <td style="font-family:var(--mono);font-size:12px">${esc(d.date||'—')}</td>
        <td class="td-amount">${n(d.amount)}</td>
        <td class="td-tax">${n(d.tax)}</td>
        <td class="td-amount" style="color:var(--green)">${n(d.total)}</td>
        <td class="td-mono">${esc(d.invoice_number||'—')}</td>
        <td class="td-notes">${esc(d.notes||'')}</td>
      </tr>`;
    }).join('');
    const tot = done.length ? `<tr class="total-row">
      <td colspan="3" style="text-align:right;color:var(--muted);font-size:12px">合　計</td>
      <td class="td-amount">${n(sa)}</td><td class="td-tax" style="font-weight:700">${n(st)}</td>
      <td class="td-amount">${n(sT)}</td><td colspan="2"></td></tr>` : '';
    tableArea.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>憑證類別</th><th>開立行號</th><th>日期</th>
        <th style="text-align:right">金額（未稅）</th>
        <th style="text-align:right">稅額</th>
        <th style="text-align:right">含稅總計</th>
        <th>發票號碼</th><th>備註</th>
      </tr></thead>
      <tbody>${rows}${tot}</tbody>
    </table></div>`;
  }

  // toolbar
  const done = files.filter(f=>f.data);
  if (!files.length) {
    resultCount.textContent = '尚未上傳任何檔案';
    sumDisplay.style.display = 'none';
  } else {
    resultCount.innerHTML = `已辨識 <strong>${done.length}</strong> 張 / 共 ${files.length} 張`;
    if (done.length) {
      const sT = done.reduce((s,f)=>s+(Number(f.data.total)||0),0);
      sumDisplay.style.display='';
      sumDisplay.innerHTML=`含稅合計 <strong style="color:var(--green)">NT$ ${sT.toLocaleString('zh-TW')}</strong>`;
    } else { sumDisplay.style.display='none'; }
  }
  dlBtn.disabled = done.length === 0;
  updateAnalyzeBtn();
}

function updateAnalyzeBtn() {
  const p = files.filter(f=>f.status==='pending').length;
  const l = files.filter(f=>f.status==='loading').length;
  analyzeBtn.disabled = p===0 || l>0;
  if (l===0) analyzeBtn.innerHTML = p>0 ? `✨ 開始辨識 (${p} 張)` : '✨ 開始辨識';
}

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function n(v){ return (v==null||v==='') ? '—' : Number(v).toLocaleString('zh-TW'); }
function fmtSize(b){ return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'; }

render();
</script>
</body>
</html>
